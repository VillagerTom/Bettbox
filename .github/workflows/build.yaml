name: build

on:
  push:
    branches:
      - android_legacy
  workflow_dispatch:

# A push and a manual dispatch can target the same commit and therefore the
# same release tag; serialize runs per ref so two runs never write one release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  
jobs:
  metadata:
    # Maintenance pushes can opt out of CI with a `[skip ci]` marker in the
    # commit message. Dependent jobs are skipped automatically. A manual
    # dispatch has no head_commit, so the marker never matches and a dispatch
    # always runs — that is the intended escape hatch.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.tag.outputs.latest_tag }}
      is_stable: ${{ steps.tag.outputs.is_stable }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/appshubcc/Bettbox.git
          git fetch --tags --force upstream

      - name: Read upstream tag
        id: tag
        shell: bash
        run: |
          # Name the release after the upstream release this tree is based on:
          # the newest upstream release tag visible on this branch (an ancestor
          # of HEAD). Naming by that tag rather than by the newest tag upstream
          # is what lets an older version be re-released after a re-tag.
          tags="$(git for-each-ref --sort=-creatordate \
            --format='%(refname:short)' refs/tags \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-pre[0-9]+)?$' || true)"
          latest_tag=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if git merge-base --is-ancestor "$t" HEAD; then
              latest_tag=$t
              break
            fi
          done <<< "$tags"

          if [ -z "$latest_tag" ]; then
            echo "::error::HEAD carries no upstream release tag"
            exit 1
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

          if [[ "${latest_tag}" != *-* ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${latest_tag,,}" == *pre* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: metadata
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      IS_STABLE: ${{ needs.metadata.outputs.is_stable }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: android
            os: ubuntu-24.04
            arch: amd64
          - platform: android
            os: ubuntu-24.04
            arch: arm
          - platform: android
            os: ubuntu-24.04
            arch: universal
          - platform: android
            os: ubuntu-24.04
            arch: arm64
            lite: true
          - platform: android
            os: ubuntu-24.04
            arch: amd64
            lite: true
          - platform: android
            os: ubuntu-24.04
            arch: arm
            lite: true
          - platform: android
            os: ubuntu-24.04
            arch: universal
            lite: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Keystore (Android)
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties
          
      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          ANDROID_NDK=${ANDROID_HOME}/ndk/${NDK_VERSION}
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          attempt=0
          while true; do
            if [[ -d "${ANDROID_NDK}" ]]; then
              if [[ -e "${ANDROID_NDK}/package.xml" ]]; then
                echo "ANDROID_NDK=${ANDROID_NDK}" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "NDK install attempt ${attempt}/3 failed" >&2
              rm -rf "${ANDROID_NDK}"
              sleep 5
            fi
            [[ "$attempt" -gt 3 ]] && exit 1
            : $((attempt++))
            timeout -k 10 600 "${SDKMANAGER}" --install "ndk;${NDK_VERSION}" <<< "y" >/dev/null || true
          done

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.47.7' }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true


      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Build Bettbox (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.lite == true && '--lite' || '' }}

      - name: Upload Artifacts (Android)
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.lite == true && '-lite' || '' }}
          path: ./dist/*
          archive: false
          overwrite: true

  upload:
    permissions: write-all
    needs: [ build, metadata ]
    if: ${{ needs.metadata.outputs.is_stable == 'true' || needs.metadata.outputs.is_prerelease == 'true' }}
    runs-on: ubuntu-latest
    env:
      IS_STABLE: ${{ needs.metadata.outputs.is_stable }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
      LATEST_TAG: ${{ needs.metadata.outputs.latest_tag }}
      RELEASE_TAG: ${{ needs.metadata.outputs.latest_tag }}-android-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Bettbox-*
          merge-multiple: true
          skip-decompress: true

      - name: Generate release.md
        run: |
          printf '%s\n' "- Fixes and improvements" "- Recommended version update" > release.md

      - name: Patch release.md
        run: |
          version="${LATEST_TAG#v}"
          base_version="${version%%-pre*}"
          if [ "${IS_PRERELEASE}" == "true" ]; then
            sed -e "s|RELEASE_TAG|$RELEASE_TAG|g" -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|RELEASE_TAG|$RELEASE_TAG|g" -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Pin an auto-created release tag to the commit this run built,
          # instead of the repository default branch (the action's default).
          target_commitish: ${{ github.sha }}
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

